[versions]
# project modules version
p-root = "2.1.2-dev"
p-honoka-utils = "1.1.3-dev"
p-honoka-kotlin-utils = "1.1.2-dev"
p-honoka-spring-boot-starter = "1.0.3-dev"

# gradle plugins version
gp-honoka-basic = "1.0.1-dev"

# dependencies version
d-hku-honoka-utils = "1.1.3-dev"
d-hsbs-honoka-kotlin-utils = "1.1.2-dev"
d-spring-boot = "3.2.5"
d-kotlin = "1.8.10"
d-kotlin-coroutines = "1.6.4"
d-lombok = "1.18.26"

[plugins]
honoka-basic = { id = "de.honoka.gradle.plugin.basic", version.ref = "gp-honoka-basic" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "d-kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "d-kotlin" }
kotlin-lombok = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "d-kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "d-kotlin" }
dependency-management = "io.spring.dependency-management:1.1.6"

[libraries]
hku-honoka-utils = { module = "de.honoka.sdk:honoka-utils", version.ref = "d-hku-honoka-utils" }
hsbs-honoka-kotlin-utils = { module = "de.honoka.sdk:honoka-kotlin-utils", version.ref = "d-hsbs-honoka-kotlin-utils" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "d-spring-boot" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "d-kotlin" }
slf4j-api = "org.slf4j:slf4j-api:2.0.7"
logback = "ch.qos.logback:logback-classic:1.4.14"
lombok = { module = "org.projectlombok:lombok", version.ref = "d-lombok" }
